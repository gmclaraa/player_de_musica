<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player de Música</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <img class="capa" src="./imagens/barão.jpg" alt="barão vermelho">
    <div class="descricao">
        <h2>Sorte ou Azar</h2>
        <i>Barão Vermelho</i>
    </div>
    <div class="duracao">
        <div class="barra">
            <progress value="0.5" max="1"></progress>
            <div class="ponto"></div>
        </div>
        <div class="tempo">
            <p class="inicio">0:00</p>
            <p class="fim">3:40</p>
        </div>
    </div>
    <div class="player">
        <img src="./imagens/seta-esquerda.svg" width="32px" height="32px" alt="seta-esquerda">
        <img src="./imagens/play.svg" width="32px" height="32px" alt="play">
        <img src="./imagens/pause.svg" width="32px" height="32px" alt="pause">
        <img src="./imagens/seta-direita.svg" width="32px" height="32px" alt="seta-direita">
    </div>
    <audio src="./musicas/Barão Vermelho - Sorte e Azar - Som Livre (youtube).mp3"></audio>
    <script src="./script.js"></script>
</body>

</html>
