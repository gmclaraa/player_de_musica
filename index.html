<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player de Música</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <img class="capa" src="./imagens/barão.jpg" alt="barão vermelho">
    <div class="descricao">
        <h2>Sorte E Azar</h2>
        <i>Barão Vermelho</i>
    </div>
    <div class="duracao">
        <div class="barra">
            <progress value="0" max="1"></progress>
            <div class="ponto"></div>
        </div>
        <div class="tempo">
            <p class="inicio">0:00</p>
            <p class="fim">3:40</p>
        </div>
    </div>
    <div class="player">
        <img class="icone seta-e" src="./imagens/seta-esquerda-b.svg"  alt="seta-esquerda">
        <img class="icone play" src="./imagens/play-b.svg"  alt="play">
        <img class="icone pause" src="./imagens/pause-b.svg"  alt="pause">
        <img class="icone seta-d" src="./imagens/seta-direita-b.svg"  alt="seta-direita">
    </div>
    <audio  src="./musicas/musica1.mp3"></audio>
    <script src="./script.js"></script>
</body>

</html>
